# Intégration continue : à chaque push et pull request, rejoue tous les tests.
# - base de données : migrations sur un PostgreSQL vierge + tests SQL + contrôles d'intégrité
# - backend : tests de l'API (dont le parcours complet d'un joueur)
# - application : analyse du code, tests d'écrans, compilation Web
name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-backend:
    name: Base de données et backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Migrations et tests SQL
        run: bash supabase/tests/run_local.sh
      - name: Dépendances du backend
        run: pip install -r backend/requirements.txt
      - name: Tests du backend
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/methe_test
        run: python -m pytest -q

  app:
    name: Application Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyse du code
        run: flutter analyze
      - name: Tests
        run: flutter test
      # Le dépôt ne versionne pas les fichiers générés par Flutter (web/index.html…) :
      # on les crée comme indiqué dans le README, sans toucher à lib/ ni test/.
      - name: Compilation Web
        run: |
          flutter create . --platforms=web --project-name methe
          flutter build web --release
